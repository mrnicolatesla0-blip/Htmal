<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101326">
<title>Dreamy Vibe | Anshu Music Lab</title>
<style>
:root{color-scheme:dark;--bg:#101326;--panel:#1b2038;--muted:#a9b0ca;--accent:#b7a5ff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 15% 15%,#34305d 0,transparent 36%),radial-gradient(circle at 90% 85%,#23465a 0,transparent 32%),var(--bg);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#f5f3ff}
.player{width:min(440px,100%);padding:30px;border:1px solid #ffffff20;border-radius:28px;background:#1b2038eF;box-shadow:0 24px 80px #0008}
.art{height:210px;border-radius:20px;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 45%,#d6c6ff 0 3%,#8d7be9 4% 13%,transparent 14%),radial-gradient(circle at 50% 50%,#6e68c8,#242d59 55%,#182039);position:relative}
.art:before,.art:after{content:"";position:absolute;border:1px solid #ffffff45;border-radius:50%;width:180px;height:180px}
.art:after{width:250px;height:250px}
.disc{font-size:54px;z-index:1;filter:drop-shadow(0 5px 15px #0008)}
.tag{margin:24px 0 5px;color:var(--accent);font-size:12px;letter-spacing:3px;text-transform:uppercase}
h1{font-size:27px;margin:0}
p{color:var(--muted);margin:8px 0 22px}
.controls{display:flex;justify-content:center;align-items:center;gap:18px;margin:20px 0}
button{border:0;border-radius:50%;width:54px;height:54px;background:#ffffff16;color:white;font-size:20px;cursor:pointer}
button.primary{width:68px;height:68px;background:var(--accent);color:#17142b;font-size:25px}
button:focus-visible,input:focus-visible{outline:3px solid white;outline-offset:3px}
button:disabled{opacity:.45;cursor:not-allowed}
.track{width:100%;accent-color:var(--accent);cursor:pointer}
.times{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:6px}
.volume{display:flex;align-items:center;gap:12px;margin-top:20px;color:var(--muted);font-size:13px}
.volume input{flex:1;accent-color:var(--accent)}
.status{text-align:center;min-height:20px;font-size:12px;color:var(--muted);margin-top:18px}
</style>
</head>
<body>
<main class="player">
  <div class="art" aria-label="Abstract dreamy album artwork"><span class="disc">☾</span></div>
  <div class="tag">Anshu Music Lab</div>
  <h1>Dreamy Chill</h1>
  <p>Original ambient melody · Synthesized in your browser</p>
  <input id="seek" class="track" type="range" min="0" max="8" step="0.01" value="0" aria-label="Track position">
  <div class="times"><span id="elapsed">0:00</span><span>0:08</span></div>
  <div class="controls">
    <button id="restart" aria-label="Restart">↺</button>
    <button id="play" class="primary" aria-label="Play">▶</button>
    <button id="stop" aria-label="Stop">■</button>
  </div>
  <label class="volume">Volume <input id="volume" type="range" min="0" max="1" step="0.01" value="0.65"></label>
  <div id="status" class="status" role="status">Press play to generate and hear the music.</div>
</main>
<script>
const DURATION=8;
let ctx=null, master=null, startedAt=0, offset=0, playing=false, raf=null, nodes=[];
const playBtn=document.getElementById('play'), seek=document.getElementById('seek');
const statusText=document.getElementById('status');
const melody=[261.63,329.63,392.00,329.63,293.66,349.23,440.00,392.00];
const bass=[130.81,130.81,146.83,146.83,110.00,110.00,130.81,130.81];
function makeTone(freq,start,duration,gain,kind='sine'){
  const osc=ctx.createOscillator(), amp=ctx.createGain();
  osc.type=kind; osc.frequency.value=freq;
  amp.gain.setValueAtTime(0.0001,start);
  amp.gain.linearRampToValueAtTime(gain,start+0.06);
  amp.gain.setValueAtTime(gain,start+Math.max(0.07,duration-0.12));
  amp.gain.exponentialRampToValueAtTime(0.0001,start+duration);
  osc.connect(amp); amp.connect(master);
  osc.start(start); osc.stop(start+duration+0.02);
  nodes.push(osc);
}
function scheduleMusic(from){
  const end=ctx.currentTime+(DURATION-from);
  for(let t=from;t<DURATION;t+=0.5){
    const index=Math.floor(t/0.5)%melody.length;
    const at=ctx.currentTime+(t-from), length=Math.min(0.48,DURATION-t);
    const fade=Math.min(1,(DURATION-t)/1);
    makeTone(melody[index],at,length,0.105*fade,'sine');
    if(index%2===0) makeTone(melody[index]/2,at,length,0.13*fade,'triangle');
  }
  makeTone(196,ctx.currentTime,Math.max(0.1,DURATION-from),0.025,'sine');
  makeTone(246.94,ctx.currentTime,Math.max(0.1,DURATION-from),0.018,'sine');
}
function update(){
  if(!playing)return;
  offset=Math.min(DURATION,ctx.currentTime-startedAt);
  seek.value=offset;
  document.getElementById('elapsed').textContent='0:'+String(Math.floor(offset)).padStart(2,'0');
  if(offset>=DURATION){stopMusic();statusText.textContent='Track finished. Press play to listen again.';return;}
  raf=requestAnimationFrame(update);
}
async function playMusic(){
  if(playing)return;
  if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=Number(document.getElementById('volume').value);master.connect(ctx.destination);}
  await ctx.resume();
  if(offset>=DURATION)offset=0;
  nodes=[];
  scheduleMusic(offset);
  startedAt=ctx.currentTime-offset;
  playing=true;playBtn.textContent='Ⅱ';playBtn.setAttribute('aria-label','Pause');
  statusText.textContent='Playing your generated chill vibe.';
  update();
}
function pauseMusic(){
  if(!playing)return;
  offset=Math.min(DURATION,ctx.currentTime-startedAt);
  playing=false;cancelAnimationFrame(raf);
  if(ctx)ctx.suspend();
  playBtn.textContent='▶';playBtn.setAttribute('aria-label','Play');
  statusText.textContent='Paused.';
}
function stopMusic(){
  playing=false;cancelAnimationFrame(raf);
  nodes.forEach(n=>{try{n.stop()}catch(e){}});
  if(ctx)ctx.suspend();
  offset=0;seek.value=0;document.getElementById('elapsed').textContent='0:00';
  playBtn.textContent='▶';playBtn.setAttribute('aria-label','Play');
}
playBtn.addEventListener('click',()=>playing?pauseMusic():playMusic());
document.getElementById('stop').addEventListener('click',stopMusic);
document.getElementById('restart').addEventListener('click',()=>{stopMusic();playMusic()});
document.getElementById('volume').addEventListener('input',e=>{if(master)master.gain.value=Number(e.target.value)});
seek.addEventListener('input',e=>{
  const wasPlaying=playing; stopMusic(); offset=Number(e.target.value);
  document.getElementById('elapsed').textContent='0:'+String(Math.floor(offset)).padStart(2,'0');
  if(wasPlaying)playMusic();
});
</script>
</body>
</html>
