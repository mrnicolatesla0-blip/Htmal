<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>भारत माता की जय 🇮🇳</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(
        #FF9933 33.33%, white 33.33% 66.66%, #138808 66.66%
      );
    }
    main {
      background: white;
      padding: 35px 20px;
      border-radius: 20px;
      box-shadow: 0 8px 25px #0003;
    }
    h1 { color: #d96700; }
    .chakra { color: #1a4b9b; font-size: 55px; }
    h2 { color: #138808; }
  </style>
</head>
<body>
  <main>
    <h1>🇮🇳 भारत माता की जय 🇮🇳</h1>
    <div class="chakra">☸</div>
    <h2>वन्दे मातरम्</h2>
    <p>जय हिन्द • जय भारत</p>
  </main>
</body>
</html>
