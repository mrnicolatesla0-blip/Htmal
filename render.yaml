services:
  - type: web
    name: bharat-market-data
    runtime: python
    plan: free
    region: singapore
    rootDir: market-app
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: off
